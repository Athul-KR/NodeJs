<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopStack — Home</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Shop<span>Stack</span></a>

        <nav class="header-actions">
            <!-- logged-out -->
            <div id="guest-actions" hidden>
                <a class="btn btn-outline" href="/login.html">Login</a>
            </div>

            <!-- logged-in -->
            <div id="user-actions" class="user-actions" hidden>
                <span class="cart-chip" id="cart-chip" title="Items in your cart">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.2 14h9.9c.75 0 1.41-.41 1.75-1.03l3.24-6.14A1 1 0 0 0 21.2 5.4H6.3l-.94-2H2v2h2l3.6 7.59-1.35 2.44C5.52 16.76 6.48 18 7.2 18h12v-2H7.42l1.1-2z"/>
                    </svg>
                    <span class="badge" id="cart-count">0</span>
                </span>
                <span class="user-name" id="user-name"></span>
                <button class="btn btn-outline" id="logout-btn" type="button">Logout</button>
            </div>
        </nav>
    </header>

    <main class="container">
        <p id="page-state" class="page-state">Loading…</p>

        <section id="home-content" hidden>
            <div class="hero">
                <h1 id="hero-title">Welcome to ShopStack</h1>
                <p class="hero-sub">Fresh picks from our catalog, updated as new products land.</p>
            </div>

            <div class="stats-row" id="stats-row">
                <div class="stat-card">
                    <span class="stat-value" id="total-products">–</span>
                    <span class="stat-label">Total Products</span>
                </div>
                <div class="stat-card" id="cart-stat" hidden>
                    <span class="stat-value" id="cart-stat-count">–</span>
                    <span class="stat-label">Items in Cart</span>
                </div>
                <div class="stat-card" id="order-stat" hidden>
                    <span class="stat-value" id="order-stat-count">–</span>
                    <span class="stat-label">My Orders</span>
                </div>
            </div>

            <section class="products-section">
                <div class="section-head">
                    <h2>Latest Products</h2>
                    <span class="section-hint" id="latest-hint"></span>
                </div>
                <div class="product-grid" id="product-grid"></div>
                <p class="empty-note" id="no-products" hidden>No products available yet — check back soon.</p>
            </section>
        </section>
    </main>

    <footer class="site-footer">ShopStack — demo storefront</footer>

    <script src="/js/api.js"></script>
    <script src="/js/home.js"></script>
</body>
</html>
